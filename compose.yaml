services:
  open_pi_robot:
    image: open-pi-robot-img:jazzy
    platform: ${ROBOT_PLATFORM:-linux/arm64}
    container_name: open-pi-robot

    build:
      context: .
      dockerfile: docker/Dockerfile

    network_mode: host
    privileged: true

    volumes:
      - ./:/open_pi_robot

    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      
    working_dir: /open_pi_robot

    command: ros2 launch open_pi_bringup robot_launch.py
